version: '3.8'

services:
  api:
    build: .
    container_name: entrepreneur_mitra_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/entrepreneur_mitra
      - SECRET_KEY=sih26092-production-secret-key-replace-in-cloud
      - MOCK_AI=True
      - MOCK_VOICE=True
      - MOCK_OCR=True
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    container_name: entrepreneur_mitra_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=entrepreneur_mitra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
